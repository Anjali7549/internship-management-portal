<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>
<body>

<h1>Student Registration Form</h1>

<form>

    <label>Full Name:</label><br>
    <input type="text" name="fullname"><br><br>

    <label>Father Name:</label><br>
    <input type="text" name="fathername"><br><br>

    <label>Mother Name:</label><br>
    <input type="text" name="mothername"><br><br>

    <label>Email:</label><br>
    <input type="email" name="email"><br><br>

    <label>Phone:</label><br>
    <input type="tel" name="phone"><br><br>

    <label>Alternate Phone:</label><br>
    <input type="tel" name="alternatephone"><br><br>

    <label>Date of Birth:</label><br>
    <input type="date" name="dob"><br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <input type="radio" name="gender"> Other
    <br><br>

    <label>Address:</label><br>
    <textarea rows="4" cols="40"></textarea><br><br>

    <label>State:</label><br>
    <input type="text" name="state"><br><br>

    <label>City:</label><br>
    <input type="text" name="city"><br><br>

    <label>Country:</label><br>
    <input type="text" name="country"><br><br>

    <label>College Name:</label><br>
    <input type="text" name="college"><br><br>

    <label>Branch:</label><br>
    <input type="text" name="branch"><br><br>

    <label>Semester:</label><br>
    <select>
        <option>Select Semester</option>
        <option>1st</option>
        <option>2nd</option>
        <option>3rd</option>
        <option>4th</option>
        <option>5th</option>
        <option>6th</option>
    </select>
    <br><br>

    <label>Skills:</label><br>
    <input type="checkbox"> HTML
    <input type="checkbox"> CSS
    <input type="checkbox"> JavaScript
    <input type="checkbox"> React
    <br><br>

    <label>LinkedIn Profile:</label><br>
    <input type="url" name="linkedin"><br><br>

    <label>GitHub Profile:</label><br>
    <input type="url" name="github"><br><br>

    <label>Resume Upload:</label><br>
    <input type="file"><br><br>

    <label>Aadhaar Upload:</label><br>
    <input type="file"><br><br>

    <input type="checkbox">
    I hereby declare that all the information provided is true.
    <br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Reset">

</form>
<p>Registration Updated - Commit 3</p>
</body>
</html>
